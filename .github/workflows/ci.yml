name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    # Monday at 09:00 in Mexico City, including weeks without new commits.
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Install audio system libraries
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1

      - name: Audit dependencies
        run: pip-audit

      - name: Lint with Ruff
        run: ruff check backend/

      - name: Check formatting
        run: ruff format --check backend/

      - name: Backend regression tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
