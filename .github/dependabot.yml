# GitHub reads this file from main, even when updates target development.
# One weekly PR covering frontend, backend and GitHub Actions together.
version: 2

multi-ecosystem-groups:
  weekly-deps:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City
    target-branch: development
    commit-message:
      prefix: chore(deps)

updates:
  - package-ecosystem: bun
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps

  - package-ecosystem: pip
    directory: /backend
    versioning-strategy: increase
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
